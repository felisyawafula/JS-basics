<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Switch Case</title>
</head>
<body>

<script>
    let day = prompt('Enter day of the week',1)
    console.log(typeof day)

    switch (+day){
        case 1 :
            console.log("Rate is 200")
            break
        case 2 :
            console.log("Rate is 210")
            break
        case 3 :
            console.log("Rate is 220")
            break
        case 4 :
            console.log("Rate is 230")
            break
        case 5 :
        case 6 :
        case 7 :
            console.log("Rate is 245")
            break
        default:
            console.log("Invalid value")
    }



</script>

</body>
</html>
